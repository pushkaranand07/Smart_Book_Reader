# Local production-like stack: API + worker (shared SQLite registry/queue on a volume) + frontend (nginx).
#   cp .env.example .env   # set API_KEYS and MEDIA_SIGNING_SECRET
#   docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: smart-book-reader-api:local
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    environment:
      JOBS_MODE: huey
      DATA_DIR: /app/data
      PORT: ${PORT:-8000}
    volumes:
      - data:/app/data
      - ./model:/app/model
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/readyz')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  worker:
    image: smart-book-reader-api:local
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      JOBS_MODE: huey
      DATA_DIR: /app/data
    volumes:
      - data:/app/data
      - ./model:/app/model
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  data:
