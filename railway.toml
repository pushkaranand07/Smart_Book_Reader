[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "/entrypoint.sh api"
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Railway injects PORT. Set API_KEYS, MEDIA_SIGNING_SECRET and CORS_ORIGINS in the service variables,
# and attach a volume at /app/data. Use JOBS_MODE=process on a single service, or add a second service
# with startCommand "/entrypoint.sh worker" and JOBS_MODE=huey sharing the same volume.
