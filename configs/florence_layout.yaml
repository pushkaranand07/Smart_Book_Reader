# Florence-2 Picture Detection — DocLayNet config

model:
  base: microsoft/Florence-2-base
  output_dir: model/florence_layout

data:
  manifest: data/training_data/dataset_manifest.jsonl
  target_class: Picture
  require_validation_pass: true
  include_negative_pages: true
  dataset_name: DocLayNet

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  mixed_precision: fp16

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05

evaluation:
  max_val_samples: 100
  visualize_count: 20
  iou_thresholds: [0.5, 0.75]

overfit:
  n_samples: 16
  optimizer_updates: 120
  learning_rate: 3.0e-5
