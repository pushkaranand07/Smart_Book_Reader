name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0
          pip install -r requirements/dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests + coverage (api, src/qa >= 85%)
        run: pytest -q -p no:logging --cov=api --cov=src/qa --cov-report=term --cov-fail-under=85
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('src/qa/backends.py') }}
      - name: QA eval (CI fixture book, real models)
        run: python scripts/eval/run_qa_eval.py --set tests/eval/qa_ci.jsonl --books-dir tests/fixtures/books --cache-dir "" --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build (fails on any Vite warning)
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qiE "\(!\)|warning" build.log; then echo "Vite printed a warning"; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - name: E2E (mocked API) + axe
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          tags: smart-book-reader-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: smart-book-reader-frontend:ci
          load: true
      - name: Image sizes (API must be < 2.5 GB)
        run: |
          size=$(docker image inspect smart-book-reader-api:ci --format '{{.Size}}')
          echo "API image: $((size / 1024 / 1024)) MB"
          echo "Frontend image: $(( $(docker image inspect smart-book-reader-frontend:ci --format '{{.Size}}') / 1024 / 1024 )) MB"
          echo "### Image sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $((size / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 2684354560
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e API_KEYS=ci:ci-key -e MEDIA_SIGNING_SECRET=ci-secret -e FLORENCE_MODE=disabled \
            smart-book-reader-api:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          curl -fsS localhost:8000/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/books)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/media/uploads/x.pdf)" = "404"
          docker logs api | tail -20
