# Included per location because add_header in a location replaces server-level headers.
# style-src needs 'unsafe-inline' for React style props (progress bar) and KaTeX inline styles.
set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; ";
set $csp "${csp}img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; ";
set $csp "${csp}object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
